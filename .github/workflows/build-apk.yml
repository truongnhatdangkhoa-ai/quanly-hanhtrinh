name: Build APK

# Tự chạy mỗi khi có file mới được đẩy lên BẤT KỲ nhánh nào (main, master, kho-anan...).
# Không cần vào tab Actions để bấm. APK xuất hiện ở mục Releases.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Thay icon và màn hình chờ bằng logo của app
        run: |
          cp -r android-res/. android/app/src/main/res/
          find android/app/src/main/res -name "splash.png" -exec cp assets/splash.png {} \;

      - name: Thêm quyền vị trí và thông báo (nút "Vị trí của tôi", nhắc nhở)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Chèn ngay trước </manifest> (không phụ thuộc dòng INTERNET của mẫu), bỏ qua quyền đã có
          python3 - "$MANIFEST" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />',
          ]
          add = "".join("    " + x + "\n" for x in perms if x.split('"')[1] not in s)
          assert "</manifest>" in s, "AndroidManifest.xml không có thẻ </manifest>"
          s = s.replace("</manifest>", add + "</manifest>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -n "uses-permission" "$MANIFEST"

      - name: Đặt số phiên bản
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}.${{ github.run_number }}\"/" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Nâng compileSdk 35, minSdk 23 và Android Gradle Plugin (thư viện của plugin cập nhật yêu cầu)
        run: |
          # Chỉ nâng compileSdk (để biên dịch được). targetSdk giữ 34 để giao diện không đổi hành vi trên Android 15.
          sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 35/" android/variables.gradle
          # Thư viện Google đi kèm plugin yêu cầu Android 6.0 (API 23) trở lên
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 23/" android/variables.gradle
          sed -i -E "s#com.android.tools.build:gradle:[0-9.]+#com.android.tools.build:gradle:8.7.2#" android/build.gradle
          sed -i -E "s#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.9-all.zip#" android/gradle/wrapper/gradle-wrapper.properties
          echo "--- variables.gradle"; cat android/variables.gradle
          echo "--- AGP"; grep -n "com.android.tools.build" android/build.gradle
          echo "--- wrapper"; grep -n distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Dùng khóa ký cố định (để cài đè bản cũ được)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Kiểm tra APK có đủ quyền (lỗi nếu thiếu)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" perms.txt || { echo "::error::APK thiếu quyền $P"; exit 1; }
          done

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HanhTrinh.apk

      - name: Tạo gói cập nhật giao diện (app tự tải, không cần cài lại APK)
        run: |
          (cd dist && zip -qr ../bundle.zip .)
          TAG="v${VERSION_NAME}.${{ github.run_number }}"
          printf '{"version":"%s","build":%s,"bundle":"%s","url":"https://github.com/%s/releases/download/%s/bundle.zip"}\n' \
            "${VERSION_NAME}" "${{ github.run_number }}" "${VERSION_NAME}.${{ github.run_number }}" "${{ github.repository }}" "${TAG}" > update.json
          cat update.json

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}.${{ github.run_number }}
          name: Hành Trình ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          files: |
            HanhTrinh.apk
            bundle.zip
            update.json
          make_latest: true

      - name: Lưu APK vào Artifacts (dự phòng)
        uses: actions/upload-artifact@v4
        with:
          name: HanhTrinh-apk
          path: HanhTrinh.apk
