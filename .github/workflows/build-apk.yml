name: Build APK

# Tự chạy mỗi khi có file mới được đẩy lên nhánh main/master.
# Không cần vào tab Actions để bấm. APK xuất hiện ở mục Releases.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Đặt số phiên bản
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}.${{ github.run_number }}\"/" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Dùng khóa ký cố định (để cài đè bản cũ được)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HanhTrinh.apk

      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}.${{ github.run_number }}
          name: Hành Trình ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          files: HanhTrinh.apk
          make_latest: true

      - name: Lưu APK vào Artifacts (dự phòng)
        uses: actions/upload-artifact@v4
        with:
          name: HanhTrinh-apk
          path: HanhTrinh.apk
